<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para mi cumpleañera</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#1b0e2e; --vino:#7e2452; --rosa:#f2a7c3; --oro:#f0cf8e; --papel:#fff4f0; --tinta:#4a2a3d;
  --w:min(40vw,42vh,360px); --h:calc(var(--w)*1.4);
}
@media (max-aspect-ratio:1/1){:root{--w:min(78vw,50vh)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 30%,#3a1850 0%,var(--noche) 70%);
  overflow:hidden;font-family:'Caveat',cursive;color:var(--papel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.flota{position:fixed;bottom:-40px;pointer-events:none;animation:sube linear forwards;opacity:.8}
@keyframes sube{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.estrella{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--oro);animation:brilla 3s infinite ease-in-out}
@keyframes brilla{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.6)}}

/* Cámara y libro */
.escena{perspective:1800px;position:relative;width:0;height:var(--h);margin-top:-4vh;
  transform-origin:0 50%;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.libro{
  position:absolute;left:0;top:0;width:var(--w);height:var(--h);
  transform-style:preserve-3d;transform:translateX(0) rotateX(8deg);
  transition:transform 1.2s cubic-bezier(.6,.05,.25,1);font-size:calc(var(--w)/14);
}
.libro:not(.abierto){transform:translateX(-50%) rotateX(8deg);animation:flota 4s ease-in-out infinite}
.libro.cerca{transform:translateX(0) rotateX(0deg)}
@keyframes flota{0%,100%{margin-top:0}50%{margin-top:-14px}}
.hoja{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.3s cubic-bezier(.5,.05,.3,1);cursor:pointer;
}
.hoja.volteada{transform:rotateY(-180deg)}
.cara{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--papel);padding:1.3em 1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;
  border-radius:2px 10px 10px 2px;color:var(--tinta);
  background-image:linear-gradient(90deg,rgba(126,36,82,.18),transparent 12%);
  box-shadow:inset -2px 0 6px rgba(0,0,0,.08);
}
.cara.atras{transform:rotateY(180deg);border-radius:10px 2px 2px 10px;
  background-image:linear-gradient(270deg,rgba(126,36,82,.18),transparent 12%)}
.base{position:absolute;inset:0}

.cara.portada{
  background:linear-gradient(135deg,#9a2f66,var(--vino) 55%,#561a3a);color:var(--oro);
  border:2px solid var(--oro);outline:6px solid #561a3a;outline-offset:-12px;text-align:center;overflow:hidden;
}
.portada::after{
  content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-50%;
  background:linear-gradient(100deg,transparent,rgba(255,240,200,.45),transparent);
  transform:skewX(-20deg);animation:destello 4.5s infinite;
}
@keyframes destello{0%,60%{left:-50%}100%{left:130%}}
.titulo{font-family:'Pinyon Script',cursive;font-size:2.7em;line-height:1.05;text-shadow:0 0 18px rgba(240,207,142,.6)}
.corazon{font-size:2.2em;animation:late 1.2s infinite}
@keyframes late{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.95)}}
.toca{font-size:1.1em;opacity:.85;animation:parpadea 2s infinite}
@keyframes parpadea{50%{opacity:.35}}

/* La foto ocupa el espacio que deja el texto, sea cual sea su tamaño */
.foto{
  flex:1 1 0;min-height:0;width:90%;position:relative;background:#fff;
  box-shadow:0 4px 12px rgba(74,42,61,.3);transform:rotate(-1.6deg);
}
.cara.atras .foto,.der .foto{transform:rotate(1.4deg)}
.foto img,.vacia{position:absolute;inset:.45em;width:calc(100% - .9em);height:calc(100% - .9em);display:block}
.foto img{object-fit:cover;object-position:50% 30%}
.vacia{display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#f9d3e0,#e9c7f0);font-size:2.4em}
.cinta{position:absolute;top:-.7em;left:50%;width:4em;height:1.3em;margin-left:-2em;z-index:2;
  background:rgba(240,207,142,.75);transform:rotate(-4deg)}
.texto{flex:none;font-size:1.2em;text-align:center;line-height:1.15;font-weight:500}
.saludo{font-family:'Pinyon Script',cursive;font-size:2.4em;color:var(--vino);text-align:center;line-height:1.1}
.final{font-size:1.35em}

/* Controles y reproductor */
.controles{position:fixed;bottom:3vh;display:flex;gap:1rem;align-items:center;z-index:50}
.controles button{
  font:700 1.3rem 'Caveat',cursive;color:var(--oro);background:rgba(126,36,82,.55);
  border:1.5px solid var(--oro);border-radius:999px;padding:.35em 1.2em;cursor:pointer;transition:.2s;
}
.controles button:hover:not(:disabled){background:var(--vino);transform:scale(1.07)}
.controles button:disabled{opacity:.3;cursor:default}
.reproductor{position:fixed;right:3vw;bottom:3vh;z-index:60;display:flex;align-items:center;gap:.6rem}
.reproductor[hidden]{display:none}
.disco{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(transparent 0 40deg,rgba(255,255,255,.16) 60deg,transparent 80deg 220deg,rgba(255,255,255,.16) 240deg,transparent 260deg),
  repeating-radial-gradient(circle,#15091f 0 2px,#26123a 2px 4px);
  box-shadow:0 0 0 2px var(--oro),0 6px 16px rgba(0,0,0,.5);
  animation:gira 4s linear infinite;animation-play-state:paused}
.disco span{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#1b0e2e 0 2px,var(--rosa) 3px)}
.reproductor.sonando .disco{animation-play-state:running}
@keyframes gira{to{transform:rotate(360deg)}}
.reproductor button{width:44px;height:44px;border-radius:50%;font:1.1rem system-ui,sans-serif;color:var(--oro);
  background:rgba(126,36,82,.55);border:1.5px solid var(--oro);cursor:pointer;transition:.2s}
.reproductor button:hover{background:var(--vino);transform:scale(1.08)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* Móvil */
@media (max-aspect-ratio:1/1){
  .controles{left:3vw;gap:.5rem}
  .controles button{font-size:1.1rem;padding:.3em .9em}
  .disco{width:46px;height:46px}.disco span{width:16px;height:16px}
  .reproductor{gap:.4rem}.reproductor button{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="escena" id="escena"><div class="libro" id="libro"></div></div>
<div class="controles">
  <button id="atras" disabled>Anterior</button>
  <button id="sig">Abrir el libro</button>
</div>
<div class="reproductor" id="repro" hidden>
  <div class="disco"><span></span></div>
  <button id="play" aria-label="Reproducir música">▶</button>
</div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
/* ================= EDITA AQUÍ ================= */
const TITULO = "Para mi cumpleañera";
const DEDICATORIA = "Feliz cumpleaños, mi vida. Pasa las páginas y recuerda conmigo.";
const RECUERDOS = [
  { src:"foto1.jpeg", texto:"El día que nos conocimos. Ya sabía que eras especial." },
  { src:"foto2.jpeg", texto:"Nuestra primera aventura juntos." },
  { src:"foto3.jpeg", texto:"Ese día en el que no paramos de reír." },
  { src:"foto4.jpeg", texto:"Mi momento favorito, siempre a tu lado." },
];
const FINAL = "Gracias por existir. Te quiero muchísimo y esto es solo el principio. ❤";
// Canción: enlace normal de SoundCloud (el de la barra del navegador)
const CANCION_URL = "https://soundcloud.com/tainy-music/tainy-alvaro-diaz-paranormal";
// Opcional: si prefieres un MP3 subido junto a este archivo, ponlo aquí (ej. "cancion.mp3") y tendrá prioridad
const CANCION_MP3 = "";
/* ============================================== */

const libro = document.getElementById('libro'), escena = document.getElementById('escena');
const tarjeta = r => `
  <div class="foto"><span class="cinta"></span>
    <img src="${r.src}" alt="" onerror="this.outerHTML='<div class=vacia>📷</div>'">
  </div>
  <p class="texto">${r.texto}</p>`;

const hojas = [
  { f:`<div class="cara portada"><div class="corazon">❤</div><h1 class="titulo">${TITULO}</h1><p class="toca">toca para abrir</p></div>`,
    b:`<div class="cara atras"><p class="saludo">¡Feliz cumple!</p><p class="texto">${DEDICATORIA}</p><div class="corazon">🎂</div></div>` },
  { f:`<div class="cara der">${tarjeta(RECUERDOS[0])}</div>`, b:`<div class="cara atras">${tarjeta(RECUERDOS[1])}</div>` },
  { f:`<div class="cara der">${tarjeta(RECUERDOS[2])}</div>`, b:`<div class="cara atras">${tarjeta(RECUERDOS[3])}</div>` },
];
libro.innerHTML = `<div class="cara base"><p class="saludo">Te quiero</p><p class="texto final">${FINAL}</p><div class="corazon">💖</div></div>` +
  hojas.map(h=>`<div class="hoja">${h.f}${h.b}</div>`).join('');

const els = [...document.querySelectorAll('.hoja')];
const bAtras = document.getElementById('atras'), bSig = document.getElementById('sig');

/* Pasos: 0 portada · 1 página izq. · 2 página der. · 3 izq. · 4 der. · 5 izq. · 6 der. (final) */
const MAX = 6;
let paso = 0, camT;
const pagDe = p => p === 0 ? 0 : Math.ceil(p/2);

function foco(){ // zoom centrado en UNA página
  const w = libro.offsetWidth, h = libro.offsetHeight;
  const z = Math.min(innerWidth*.9/w, innerHeight*.72/h, 1.7);
  return `scale(${z}) translateX(${paso % 2 ? w/2 : -w/2}px)`;
}
function camara(volteo){ // se aleja y luego se acerca a la página nueva
  clearTimeout(camT);
  libro.classList.remove('cerca');
  if(paso === 0){ escena.style.transform = 'scale(1)'; return; }
  const w = libro.offsetWidth;
  escena.style.transform = `scale(${Math.min(1, innerWidth*.94/(2*w))})`;
  camT = setTimeout(()=>{ libro.classList.add('cerca'); escena.style.transform = foco(); }, volteo ? 1300 : 800);
}
function ordenZ(pag){ els.forEach((e,i)=> e.style.zIndex = i < pag ? i+1 : els.length - i); }

function ir(n){
  const antes = pagDe(paso);
  paso = Math.max(0, Math.min(MAX, n));
  const pag = pagDe(paso);
  els.forEach((e,i)=> e.classList.toggle('volteada', i < pag));
  libro.classList.toggle('abierto', paso > 0);
  bAtras.disabled = paso === 0;
  bSig.disabled = paso === MAX;
  bSig.textContent = paso === 0 ? 'Abrir el libro' : paso === MAX ? 'Fin 💖' : 'Siguiente';
  setTimeout(()=>ordenZ(pag), 450);
  camara(pag !== antes);
}
els.forEach(e => e.addEventListener('click', ()=> ir(paso + 1)));
bSig.onclick = () => ir(paso + 1); bAtras.onclick = () => ir(paso - 1);
document.addEventListener('keydown', e => { if(e.key==='ArrowRight') ir(paso+1); if(e.key==='ArrowLeft') ir(paso-1); });
let tx = null;
addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
addEventListener('touchend', e => {
  if(tx === null) return;
  const d = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(d) > 60) ir(paso + (d < 0 ? 1 : -1));
});
addEventListener('resize', () => { if(paso > 0 && libro.classList.contains('cerca')) escena.style.transform = foco(); });

/* Fondo animado */
const EMO = ['❤','💖','🌸','✨','💗','🎈'];
setInterval(()=>{
  const s = document.createElement('span');
  s.className = 'flota'; s.textContent = EMO[Math.random()*EMO.length|0];
  s.style.left = Math.random()*100 + 'vw';
  s.style.fontSize = (14 + Math.random()*22) + 'px';
  s.style.animationDuration = (7 + Math.random()*7) + 's';
  document.body.appendChild(s); setTimeout(()=>s.remove(), 15000);
}, 700);
for(let i=0;i<40;i++){
  const s = document.createElement('i'); s.className = 'estrella';
  s.style.left = Math.random()*100 + 'vw'; s.style.top = Math.random()*100 + 'vh';
  s.style.animationDelay = Math.random()*3 + 's'; document.body.appendChild(s);
}

/* Música: solo suena al pulsar play */
function iniciarMusica(){
  const repro = document.getElementById('repro'), btn = document.getElementById('play');
  const ui = on => {
    repro.classList.toggle('sonando', on);
    btn.textContent = on ? '⏸' : '▶';
    btn.setAttribute('aria-label', on ? 'Pausar música' : 'Reproducir música');
  };
  if(CANCION_MP3){
    const a = new Audio(CANCION_MP3); a.loop = true;
    a.onplay = () => ui(true); a.onpause = () => ui(false);
    btn.onclick = () => a.paused ? a.play() : a.pause();
    repro.hidden = false; return;
  }
  if(!CANCION_URL || !window.SC) return;
  const f = document.createElement('iframe');
  f.allow = 'autoplay'; f.title = 'Canción';
  f.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0';
  f.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(CANCION_URL) + '&auto_play=false&visual=false&show_comments=false&hide_related=true';
  document.body.appendChild(f);
  const w = SC.Widget(f);
  w.bind(SC.Widget.Events.PLAY, () => ui(true));
  w.bind(SC.Widget.Events.PAUSE, () => ui(false));
  w.bind(SC.Widget.Events.FINISH, () => { w.seek(0); w.play(); });
  btn.onclick = () => w.toggle();
  repro.hidden = false;
}
addEventListener('load', iniciarMusica);
ordenZ(0);
</script>

</body>
</html>
